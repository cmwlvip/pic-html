      case "close": close(); break;
      case "next": show(active + 1); break;

  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && dialog) { event.preventDefault(); close(); return; }
    if (dialog && event.key === "Tab") {
      const controls = [...dialog.querySelectorAll("button:not(:disabled),input")].filter(el => el.getClientRects().length && !el.closest("[hidden]"));

    if (event.key === "ArrowLeft") { event.preventDefault(); show(active - 1); }

  document.addEventListener("touchstart", event => { if (event.target.closest(".showBox,.lightbox-stage") && event.touches.length === 1) touch = { x: event.touches[0].clientX, y: event.touches[0].clientY }; }, { passive: true });

    const control = dialog?.querySelector('[data-action="fullscreen"]');

  render();
})();
